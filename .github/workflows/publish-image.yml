name: GHCR publish container image

on:
  workflow_dispatch:
    inputs:
      tags:
        description: Comma- or newline-separated image tags to publish
        required: true
        type: string
        default: latest
      accumulo_version:
        description: Released Accumulo version available from Apache's distribution mirrors
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Prepare image tags
        id: tags
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          INPUT_TAGS: ${{ inputs.tags }}
        run: |
          set -eu
          tags_file="$RUNNER_TEMP/image-tags"
          : > "$tags_file"
          while IFS= read -r tag; do
            tag="$(printf '%s' "$tag" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
            [ -z "$tag" ] && continue
            if ! [[ "$tag" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
              echo "Invalid Docker image tag: $tag" >&2
              exit 1
            fi
            printf '%s:%s\n' "$IMAGE" "$tag" >> "$tags_file"
          done < <(printf '%s\n' "$INPUT_TAGS" | tr ',' '\n')

          if [ ! -s "$tags_file" ]; then
            echo "At least one image tag must be provided." >&2
            exit 1
          fi
          delimiter="$(openssl rand -hex 16)"
          {
            echo "tags<<$delimiter"
            cat "$tags_file"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          build-args: |
            ACCUMULO_VERSION=${{ inputs.accumulo_version }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
